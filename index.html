<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF2B12">
<title>Door Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Раскладка: липкая шапка с прежним логотипом, контент-обёртка 1180px, на телефоне нижняя навигация. Карточки заведений и блюд, кабинеты с боковыми вкладками. */
:root{
  --bg:#F5F5F5; --surface:#FFFFFF; --ink:#111111; --muted:#777777; --line:#E6E6EA; --soft:#EFEFF2;
  --red:#FF2B12; --red-ink:#FFFFFF; --red-soft:#FFE9E5; --red-deep:#D91F08;
  --ok:#0F8A4B; --ok-soft:#DDF4E7; --warn:#A85D00; --warn-soft:#FFF0D4; --bad:#C4180A; --bad-soft:#FDE3E0;
  --shadow:0 8px 30px rgba(17,17,17,.08); --shadow-sm:0 2px 10px rgba(17,17,17,.06);
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E10; --surface:#1A1A1E; --ink:#F4F4F6; --muted:#9C9CA8; --line:#2B2B31; --soft:#25252B;
  --red:#FF4A30; --red-soft:#3A1712; --red-deep:#FF6A52;
  --ok:#4FD18B; --ok-soft:#12301F; --warn:#F2B64C; --warn-soft:#3A2D12; --bad:#FF7A6B; --bad-soft:#3A1A16;
  --shadow:0 8px 30px rgba(0,0,0,.4); --shadow-sm:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:#1A1A1E; --ink:#F4F4F6; --muted:#9C9CA8; --line:#2B2B31; --soft:#25252B;
  --red:#FF4A30; --red-soft:#3A1712; --red-deep:#FF6A52;
  --ok:#4FD18B; --ok-soft:#12301F; --warn:#F2B64C; --warn-soft:#3A2D12; --bad:#FF7A6B; --bad-soft:#3A1A16;
  --shadow:0 8px 30px rgba(0,0,0,.4); --shadow-sm:0 2px 10px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowrap{white-space:nowrap}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:12px}
.right{margin-left:auto}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* шапка */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:18px;flex:none}
.logo svg{width:36px;height:36px;flex:none}
nav.menu{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.menu a{white-space:nowrap;text-decoration:none;padding:8px 10px;border-radius:999px;font-weight:500;color:var(--muted);font-size:14px}
nav.menu a:hover{color:var(--ink);background:var(--soft)}
nav.menu a.cur{background:var(--ink);color:var(--bg)}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);transition:background .15s}
.iconbtn:hover{background:var(--line)}
.dot{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:999px;background:var(--red);color:var(--red-ink);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.me{display:flex;align-items:center;gap:8px;border:0;background:var(--soft);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;max-width:190px}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;font-weight:700;flex:none}
.me span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 20px;font-weight:600;background:var(--red);color:var(--red-ink);text-decoration:none;transition:transform .15s ease,filter .15s ease,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn:active{transform:none}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.btn.soft{background:var(--red-soft);color:var(--red)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 14px;border-radius:11px;font-size:14px}
.btn.lg{padding:15px 26px;font-size:17px;border-radius:16px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* формы */
label{display:grid;gap:6px;font-weight:600;font-size:14px}
label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none;box-shadow:0 0 0 4px var(--red-soft)}
textarea{min-height:84px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--red)}
.form{display:grid;gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;align-items:center;gap:10px;font-weight:500}
.pick{display:grid;gap:8px}
.pick label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;font-weight:500;background:var(--surface)}
.pick label:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.pick input{margin-top:4px}
.pick small{display:block;font-weight:400;color:var(--muted)}
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:16px;cursor:pointer;color:var(--muted);background:var(--bg);min-height:92px;overflow:hidden}
.drop:hover{border-color:var(--red);color:var(--ink)}
.drop img{max-width:100%;max-height:120px;border-radius:10px}
.drop input{display:none}

/* поверхности */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0;box-shadow:var(--shadow-sm)}
.panel h3{font-size:17px;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted);border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.empty{border:2px dashed var(--line);border-radius:20px;padding:34px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn);margin-top:14px}
.banner.info{background:var(--soft);color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;padding:44px 40px;margin-top:20px;border-radius:30px;background:var(--red);color:#fff;overflow:hidden;position:relative}
.hero .eyebrow{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:clamp(28px,4.6vw,52px);font-weight:800;margin-top:12px}
.hero p.lead{margin-top:16px;max-width:50ch;font-size:18px;opacity:.95}
.hero .row{margin-top:24px}
.hero .btn{background:#fff;color:#111}
.hero .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.hero .btn.ghost:hover{box-shadow:inset 0 0 0 2px #fff}
.hero .art svg{width:100%;height:auto;display:block;max-width:420px;margin-left:auto}
@media (prefers-reduced-motion:no-preference){.scoot{animation:ride 4.5s ease-in-out infinite alternate}@keyframes ride{from{transform:translateX(0)}to{transform:translateX(-46px)}}}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.3)}
.stats b{display:block;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;opacity:.85}
.searchbar{display:flex;gap:10px;position:relative;margin-top:22px}
.searchbar input{border-radius:16px;padding:14px 16px 14px 46px;background:var(--surface);font-size:16px}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:20;overflow:hidden}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:11px 16px}
.sugg button:hover{background:var(--soft)}

/* секции */
.sec{margin-top:40px}
.sec>.hd{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.sec h2{font-size:clamp(20px,3vw,28px)}
.sec .more{color:var(--red);font-weight:600;text-decoration:none}
.pagehead{padding-block:28px 6px}
.pagehead h1{font-size:clamp(24px,4vw,38px);font-weight:800}
.pagehead p{color:var(--muted);margin-top:8px;max-width:62ch}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:10px;background:none;border:0;padding:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:transform .18s ease,box-shadow .18s ease;text-align:left;padding:0;min-width:0}
.vcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cover{height:132px;position:relative;background:var(--soft);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover svg{width:100%;height:100%;display:block}
.vcard .body{padding:14px 16px 16px;display:grid;gap:6px;position:relative}
.vcard .logo2{position:absolute;top:-28px;left:14px;width:52px;height:52px;border-radius:14px;border:3px solid var(--surface);background:var(--surface);overflow:hidden;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;color:var(--red)}
.vcard .logo2 img{width:100%;height:100%;object-fit:cover}
.vcard h3{font-size:16px;margin-top:22px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.star{color:#F5A400;font-weight:700}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);min-width:0}
.icard .pic{height:140px;background:var(--soft);position:relative;overflow:hidden}
.icard .pic img,.icard .pic svg{width:100%;height:100%;object-fit:cover;display:block}
.icard .in{padding:12px 14px 14px;display:grid;gap:6px;flex:1;align-content:start}
.icard h4{font-family:var(--font-body);font-size:16px;font-weight:700;letter-spacing:0}
.icard .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.price{font-family:var(--font-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.price s{font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.addbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--red);color:var(--red-ink);display:grid;place-items:center;transition:transform .12s}
.addbtn:hover{transform:scale(1.08)}
.addbtn[disabled]{background:var(--soft);color:var(--muted);pointer-events:none}
.venuehead{border-radius:26px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.venuehead .cover{height:200px}
.venuehead .info{padding:0 24px 22px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-top:-34px;position:relative}
.venuehead .logo3{width:84px;height:84px;border-radius:22px;border:4px solid var(--surface);background:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--red);overflow:hidden;flex:none}
.venuehead .logo3 img{width:100%;height:100%;object-fit:cover}
.venuehead h1{font-size:clamp(22px,3.4vw,32px)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
.tools input{max-width:320px;flex:1 1 160px;min-width:0}
.tools select{max-width:220px;flex:1 1 140px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.split>*{min-width:0}
.sticky{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}

/* корзина-шторка и модалки */
.veil{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:80;display:flex;justify-content:flex-end;animation:fade .15s}
.veil.mid{justify-content:center;align-items:center;padding:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{background:var(--surface);width:min(440px,100%);height:100%;padding:20px;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(20px,env(safe-area-inset-bottom,0px));overflow-y:auto;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.modal{background:var(--surface);border-radius:24px;padding:24px;width:min(560px,100%);max-height:92vh;overflow-y:auto;box-shadow:var(--shadow);animation:pop .18s ease}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mh h3{font-size:19px}
.ci{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ci .t{width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--soft)}
.ci .t img,.ci .t svg{width:100%;height:100%;object-fit:cover;display:block}
.qty{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.qty button{width:30px;height:30px;border-radius:9px;border:0;background:var(--surface);font-weight:700}
.qty b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:6px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{border-top:2px solid var(--ink);padding-top:10px;margin-top:4px;font-size:19px;font-weight:700;font-family:var(--font-display)}
.sum .disc{color:var(--ok)}

/* заказы и таймлайн */
.orders{display:grid;gap:14px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow-sm)}
.order .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.order .num{font-family:var(--font-display);font-weight:700}
.order .items{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.order .acts{display:flex;gap:8px;flex-wrap:wrap}
.tl{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:8px 0}
.tl .s{position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:34px}
.tl .s::before{content:"";position:absolute;top:9px;left:0;right:0;height:4px;background:var(--line)}
.tl .s:first-child::before{left:50%}
.tl .s:last-child::before{right:50%}
.tl .s i{position:absolute;top:0;left:50%;margin-left:-11px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:4px solid var(--line);z-index:1}
.tl .s.on::before{background:var(--red)}
.tl .s.on i{border-color:var(--red);background:var(--red)}
.tl .s.cur{color:var(--ink);font-weight:700}
.tl .s.cur i{box-shadow:0 0 0 6px var(--red-soft)}
.tl.cancel .s i,.tl.cancel .s::before{background:var(--bad-soft);border-color:var(--bad)}

/* кабинеты */
.cab{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;display:grid;gap:2px;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:12px;padding:11px 12px;font-weight:500;text-align:left;color:var(--muted)}
.side button:hover{background:var(--soft);color:var(--ink)}
.side button.on{background:var(--ink);color:var(--bg)}
.side .cnt{margin-left:auto;background:var(--red);color:var(--red-ink);border-radius:999px;font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{display:block;font-family:var(--font-display);font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto;max-width:100%}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{width:64px;height:64px;border-radius:14px;overflow:hidden;background:var(--soft)}
.item .t img,.item .t svg{width:100%;height:100%;object-fit:cover;display:block}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 0 var(--ok);animation:pu 1.8s infinite}
.pulse.idle{background:var(--warn);animation:none}
.pulse.off{background:var(--muted);animation:none}
@keyframes pu{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.chat{display:grid;gap:8px;max-height:320px;overflow-y:auto;padding:8px 2px}
.msg{max-width:84%;padding:9px 13px;border-radius:16px;background:var(--soft);font-size:14px;overflow-wrap:anywhere}
.msg.mine{margin-left:auto;background:var(--red);color:var(--red-ink)}
.msg small{display:block;opacity:.7;font-size:11px;margin-top:2px}

function cartCount(){var n=0;for(var k in S.cart.items)n+=S.cart.items[k];return n}
function cartInfo(){
  var v=get("venues",S.cart.vid),lines=[],sub=0;
  if(v)(v.items||[]).forEach(function(it){var q=S.cart.items[it.id];if(q>0){lines.push({it:it,q:q,sum:it.p*q});sub+=it.p*q}});
  var pr=promoCheck(S.cart.promo,v,sub),disc=pr.ok?pr.disc:0;
  return {v:v,lines:lines,sub:sub,fee:lines.length?FEE:0,disc:disc,promo:pr,total:Math.max(0,sub-disc)+(lines.length?FEE:0)};
}
function promoCheck(code,v,sub){
  if(!code)return {ok:false,msg:""};
  var p=get("promos",String(code).trim().toUpperCase());
  if(!p||p.active===false)return {ok:false,msg:"Промокод не найден"};
  if(p.until&&Date.now()>p.until)return {ok:false,msg:"Срок промокода истёк"};
  if(p.vid&&(!v||p.vid!==v.id))return {ok:false,msg:"Промокод не подходит для этого заведения"};
  if(p.ptype&&(!v||p.ptype!==v.type))return {ok:false,msg:"Промокод не подходит для этого типа заведений"};
  var d=p.kind==="pct"?Math.round(sub*p.val/100):Math.min(p.val,sub);
  return {ok:true,disc:d,msg:"Скидка "+(p.kind==="pct"?p.val+"%":money(p.val))};
}

/* ===== уведомления (выводятся из заказов, обращений и заявок) ===== */
function notifs(){
  var uid=S.uid,out=[],i,a=get("apps",uid);
  arr("orders").forEach(function(o){
    var ev=o.ev||{};
    Object.keys(ev).forEach(function(k){
      var e=ev[k],t=null;if(e.by===uid)return;
      if(o.cid===uid)t=({accepted:"Заказ "+o.num+" принят заведением",ready:"Заказ "+o.num+" готов к выдаче",courier_assigned:"Курьер назначен на заказ "+o.num,onroad:"Заказ "+o.num+" в пути",delivered:"Заказ "+o.num+" доставлен",cancelled:"Заказ "+o.num+" отменён"})[e.st];
      if(!t&&o.vid===uid&&e.st==="new")t="Новый заказ "+o.num;
      if(!t&&o.kid===uid&&e.st==="courier_assigned")t="Тебе назначен заказ "+o.num;
      if(t)out.push({k:k+o.id,ts:e.ts,t:t,go:"orders"});
    });
  });
  arr("complaints").forEach(function(c){
    var mine=c.cid===uid;if(!mine&&!S.isOwner)return;
    Object.keys(c.msgs||{}).forEach(function(k){var m=c.msgs[k];if(m.by===uid)return;if(S.isOwner&&m.staff)return;out.push({k:k+c.id,ts:m.ts,t:"Новое сообщение по обращению "+(c.onum||""),go:"support"})});
    if(mine&&(c.st==="solved"||c.st==="rejected")&&c.uts)out.push({k:"c"+c.id,ts:c.uts,t:"Жалоба рассмотрена: "+CST[c.st],go:"support"});
    if(S.isOwner&&c.st==="new")out.push({k:"n"+c.id,ts:c.ts,t:"Новая жалоба: "+(COMPL[c.type]||""),go:"admin"});
  });
  if(a){
    if(a.vst==="approved"||a.vst==="rejected")out.push({k:"av",ts:a.vts,t:"Заявка на подключение заведения "+(a.vst==="approved"?"одобрена":"отклонена"),go:"partner"});
    if(a.cst==="approved"||a.cst==="rejected")out.push({k:"ac",ts:a.cts,t:"Заявка курьера "+(a.cst==="approved"?"одобрена":"отклонена"),go:"join"});
  }
  if(S.isOwner)arr("apps").forEach(function(x){
    if(x.vst==="pending")out.push({k:"pv"+x.id,ts:x.vts,t:"Новая заявка партнёра: "+((x.venue||{}).name||""),go:"admin"});
    if(x.cst==="pending")out.push({k:"pc"+x.id,ts:x.cts,t:"Новая заявка курьера: "+((x.courier||{}).nick||""),go:"admin"});
  });
  out.sort(function(x,y){return y.ts-x.ts});return out.slice(0,60);
}
function unread(){var n=0;notifs().forEach(function(x){if(x.ts>S.seen)n++});return n}

/* ===== онлайн (room) ===== */
function kindNow(){
  if(S.route==="admin")return "admin";
  if(S.route==="courier")return "courier";
  if(S.route==="cabinet"){var v=get("venues",myVenueId());return v&&v.type==="store"?"store":"restaurant"}
  return "client";
}
function pushPresence(){
  if(!S.room||!S.room.ok)return;
  try{S.room.ch.track({k:kindNow(),n:nick()||"",a:document.hidden?0:1,u:S.uid||""})}catch(e){}
}
function syncPeers(){
  var st={},out=[];try{st=S.room.ch.presenceState()}catch(e){}
  Object.keys(st).forEach(function(key){(st[key]||[]).forEach(function(m){out.push({kind:"viewer",by:m.u||key,peer:key,presence:{k:m.k,n:m.n,a:m.a}})})});
  S.peers=out;
}
function onlineStats(){
  var seen={},st={all:0,client:0,courier:0,restaurant:0,store:0,admin:0};
  (S.peers||[]).forEach(function(p){
    if(p.kind!=="viewer")return;
    var key=p.by||p.peer;if(seen[key]&&seen[key].a)return;
    var pr=p.presence||{};seen[key]={k:pr.k||"client",a:pr.a!==0,n:pr.n||""};
  });
  Object.keys(seen).forEach(function(k){var x=seen[k];if(!x.a)return;st.all++;if(st[x.k]!=null)st[x.k]++});
  return st;
}
function userStatus(uid){
  var best=null;
  (S.peers||[]).forEach(function(p){if(p.kind==="viewer"&&p.by===uid){var a=(p.presence||{}).a!==0;if(!best||a)best=a?"on":"idle"}});
  return best||"off";
}

async function appDecide(uid,kind,ok,reason){
  var a=get("apps",uid)||{id:uid},r=get("roles",uid)||{},now=Date.now();
  if(kind==="v"){
    var v=get("venues",uid)||{};
    if(ok)await put("roles",uid,Object.assign({},r,{venue:v.type||"restaurant",venueStatus:"approved"}));
    await put("apps",uid,Object.assign({},a,{vst:ok?"approved":"rejected",vts:now,vreason:reason||""}));
    admLog((ok?"Одобрена":"Отклонена")+" заявка заведения «"+(v.name||uid)+"»");
  }else{
    if(ok)await put("roles",uid,Object.assign({},r,{courier:true,courierPaused:false}));
    await put("apps",uid,Object.assign({},a,{cst:ok?"approved":"rejected",cts:now,creason:reason||""}));
    admLog((ok?"Одобрена":"Отклонена")+" заявка курьера "+((a.courier||{}).nick||uid));
  }
  if(S.modal)closeAll();toast(ok?"Заявка одобрена":"Заявка отклонена");renderAll();
}

function hash32(s){var h=5381;s=String(s);for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(16)}
function emailOf(rb){var s=String(rb||"").trim().toLowerCase().replace(/[^a-z0-9_]/g,"");if(!s)s="u"+hash32(rb);return s+"@doorrush.app"}
async function fetchAll(){
  var out={},from=0,step=1000,ok=true;
  try{
    for(;;){
      var r=await S.sb.from("docs").select("coll,id,data").neq("coll","img").order("coll").order("id").range(from,from+step-1);
      if(r.error){ok=false;break}
      var rows=r.data||[];
      rows.forEach(function(x){(out[x.coll]=out[x.coll]||{})[x.id]=Object.assign({id:x.id},x.data||{})});
      if(rows.length<step)break;from+=step;
    }
  }catch(e){ok=false}
  S.netErr=!ok;
  if(ok)COLLS.forEach(function(c){S.remote[c]=out[c]||{};rebuild(c)});
  return ok;
}
function subscribeData(){
  if(S.chData)return;
  S.chData=S.sb.channel("docs-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},function(p){
    var n=p.new||{},o=p.old||{},c,id;
    if(p.eventType==="DELETE"){
      c=o.coll;id=o.id;
      if(c==="img"){var pr=String(id||"").split("__");if(S.img[pr[0]])delete S.img[pr[0]][pr[1]]}
      else if(S.remote[c])delete S.remote[c][id];
    }else{
      c=n.coll;id=n.id;
      if(c==="img"){var d=n.data||{};if(d.vid&&S.imgSub[d.vid]&&d.d){S.img[d.vid]=S.img[d.vid]||{};S.img[d.vid][d.iid]=d.d}}
      else if(S.remote[c])S.remote[c][id]=Object.assign({id:id},n.data||{});
    }
    if(c&&S.data[c])rebuild(c);scheduleRender();
  }).subscribe();
}
function setupRoom(){
  if(S.room)return;
  var ch=S.sb.channel("online",{config:{presence:{key:S.uid}}});
  S.room={ch:ch,ok:false};
  ch.on("presence",{event:"sync"},function(){syncPeers();if(S.route==="home"||S.route==="admin")scheduleRender()})
    .subscribe(function(st){if(st==="SUBSCRIBED"){S.room.ok=true;pushPresence()}});
}
async function startSession(sess){
  S.session=sess;S.uid=sess.user.id;S.guest=false;S.seen=lsGet("seen_"+S.uid,0);
  await fetchAll();
  S.loaded=true;
  try{var a=await S.sb.rpc("is_admin");S.isOwner=a.data===true&&!lsGet("admhide_"+S.uid,false);S.canAdm=S.isOwner}catch(e){}
  if(S.isOwner)await fetchAll();
  subscribeData();setupRoom();
  S.ready=true;route();
  setTimeout(function(){if(me())touch()},1500);
}
async function doLogout(){
  try{await S.sb.auth.signOut()}catch(e){}
  try{S.sb.removeAllChannels()}catch(e){}
  S.chData=null;S.room=null;S.peers=[];S.session=null;S.isOwner=false;S.canAdm=false;S.guest=true;S.uid=null;S.imgSub={};S.img={};
  COLLS.forEach(function(c){S.remote[c]={};rebuild(c)});
  S.authMode="login";location.hash="";renderAll();
}
function touch(){if(S.session&&S.uid&&get("users",S.uid))patch("users",S.uid,{ls:Date.now()})}
document.addEventListener("visibilitychange",function(){pushPresence();if(document.hidden)touch()});
function loadScript(u){return new Promise(function(res){var s=document.createElement("script");s.src=u;s.onload=function(){res(true)};s.onerror=function(){res(false)};document.head.appendChild(s)})}

  }
  if(!(window.supabase&&window.supabase.createClient)){S.fatal=true;S.loaded=true;S.ready=true;renderAll();return}
  S.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  var ss=null;try{var g=await S.sb.auth.getSession();ss=g&&g.data&&g.data.session}catch(e){}
  if(ss){try{await startSession(ss)}catch(e){S.session=null;S.loaded=true;S.ready=true;route()}}
  else{S.loaded=true;S.ready=true;route()}
  S.sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"&&S.session){setTimeout(doLogout,0)}});
  setInterval(function(){if(S.session&&!document.hidden)fetchAll().then(function(){scheduleRender()})},45000);
}
boot();
})();
</script></body></html>
